<div id="add-experience-modal"
     class="skill-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">
    <button type="button"
            class="skill-form-modal__backdrop"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah experience"></button>

    <div class="skill-form-modal__content">
        <button type="button"
                class="skill-form-modal__close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah experience">×</button>

        <h2 id="add-experience-modal-title">Tambah Experience Baru</h2>
        <form id="experience-form" class="skill-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    <p class="form-error" data-error-for="{{ field.name }}"></p>
                </div>
            {% endfor %}
            <div class="skill-form-modal__actions">
                <button type="button" class="button button-secondary"
                        popovertarget="add-experience-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Experience</button>
            </div>
        </form>
    </div>
</div>
